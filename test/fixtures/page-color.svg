<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   width="800"
   height="600"
   viewBox="0 0 800 600"
   version="1.1"
   id="svg1">
  <title>Page colour</title>
  <sodipodi:namedview id="namedview1" pagecolor="white" inkscape:pageopacity="1" inkscape:current-layer="layer1" />
  <g inkscape:groupmode="layer" inkscape:label="Layer 1" id="layer1" style="display:inline">
    <rect id="r1" x="50" y="50" width="320" height="180" style="fill:#3366cc" />
    <circle id="hideme" cx="210" cy="140" r="40" style="fill:#ffcc00" />
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Layer 2" id="layer2" style="display:inline">
    <rect id="r2" x="430" y="370" width="320" height="180" style="fill:#cc6633" />
  </g>
</svg>
