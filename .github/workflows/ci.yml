# The gate. See docs/software-factory/code-standard.md, section 1.5.
# Every job here is marked required in the branch protection of master once it
# is green; a check is never required while red (section 1, "Cleanups").
name: CI

on:
    pull_request:
    push:
        branches: [master]

jobs:
    check:
        name: Format, lint, CSS, types
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run check

    build:
        name: Build and test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npx gulp
            - run: sudo apt-get update && sudo apt-get install -y xvfb
            - run: npm test
            - name: Keep the Electron build of this commit
              if: github.event_name == 'push'
              uses: actions/upload-artifact@v4
              with:
                  name: electron-${{ github.sha }}
                  path: build/electron
                  retention-days: 30
